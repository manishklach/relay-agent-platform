name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify generated database migrations
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle
      - name: Exercise local API workflow
        shell: bash
        run: |
          npm run dev > /tmp/relay-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/overview > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/relay-dev.log
              exit 1
            fi
            sleep 1
          done
          npm run test:smoke
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
